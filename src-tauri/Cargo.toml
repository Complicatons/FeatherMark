[package]
name = "feathermark"
version = "0.2.0"
description = "A tiny, fast Markdown viewer"
authors = ["FeatherMark contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "feathermark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
url = "2.5"
