name: Cross-platform release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify tag and aligned project versions
        id: version
        shell: pwsh
        run: |
          $tauriVersion = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersion = ([regex]::Match((Get-Content -Raw src-tauri/Cargo.toml), '(?m)^version = "([^"]+)"')).Groups[1].Value
          $npmVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $expectedTag = "v$tauriVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match application version $tauriVersion. Expected $expectedTag."
          }
          if ($cargoVersion -ne $tauriVersion -or $npmVersion -ne $tauriVersion) {
            throw "Version mismatch: Tauri=$tauriVersion Cargo=$cargoVersion npm=$npmVersion"
          }
          "version=$tauriVersion" >> $env:GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            platform: windows
            architecture: x64
          - label: macOS Apple Silicon
            runner: macos-latest
            platform: macos
            architecture: aarch64
          - label: macOS Intel
            runner: macos-15-intel
            platform: macos
            architecture: x64
          - label: Linux x64
            runner: ubuntu-22.04
            platform: linux
            architecture: x64
          - label: Linux ARM64
            runner: ubuntu-22.04-arm
            platform: linux
            architecture: aarch64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install build dependencies
        run: npm ci

      - name: Test and lint
        run: |
          node --check src/app.js
          npm run check:themes
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build production packages
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: npm run build

      - name: Create Windows portable package
        if: runner.os == 'Windows'
        run: npm run package:windows

      - name: Stage consistently named release assets
        shell: pwsh
        run: ./scripts/stage-release-assets.ps1 -Platform '${{ matrix.platform }}' -Architecture '${{ matrix.architecture }}'

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - validate
      - build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download all platform assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release contents and write checksums
        shell: pwsh
        run: |
          $version = '${{ needs.validate.outputs.version }}'
          $expected = @(
            "FeatherMark-$version-windows-x64-portable.exe",
            "FeatherMark-$version-windows-x64-setup.exe",
            "FeatherMark-$version-macos-aarch64.dmg",
            "FeatherMark-$version-macos-x64.dmg",
            "FeatherMark-$version-linux-aarch64.AppImage",
            "FeatherMark-$version-linux-aarch64.deb",
            "FeatherMark-$version-linux-x64.AppImage",
            "FeatherMark-$version-linux-x64.deb"
          )
          $actual = @(Get-ChildItem -LiteralPath release-assets -File | Select-Object -ExpandProperty Name | Sort-Object)
          $missing = @($expected | Where-Object { $_ -notin $actual })
          $unexpected = @($actual | Where-Object { $_ -notin $expected })
          if ($missing.Count -or $unexpected.Count) {
            throw "Release asset mismatch. Missing: $($missing -join ', ') Unexpected: $($unexpected -join ', ')"
          }
          $checksums = foreach ($name in ($expected | Sort-Object)) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path release-assets $name)).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $checksums | Set-Content -LiteralPath release-assets/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --title "FeatherMark $GITHUB_REF_NAME" \
            --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"
