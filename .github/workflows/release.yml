name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build draft Windows release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: npm ci

      - name: Verify release tag and project version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match application version $version. Expected $expectedTag."
          }

      - name: Test and lint
        run: |
          node --check src/app.js
          npm run check:themes
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Windows packages
        run: npm run build

      - name: Stage release assets
        run: npm run package:windows

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath dist/windows -Filter *.exe | ForEach-Object FullName
          if ($assets.Count -ne 2) {
            throw "Expected two Windows release assets, found $($assets.Count)."
          }
          gh release create $env:GITHUB_REF_NAME $assets --verify-tag --draft --generate-notes --title "FeatherMark $env:GITHUB_REF_NAME"
